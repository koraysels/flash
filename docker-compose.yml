services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      FLASH_PIN: ${FLASH_PIN}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - flash_models:/app/backend/models
    networks:
      - flash

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Vite needs the VITE_ prefix at build time; the stack .env stores it as
        # GOOGLE_MAPS_API_KEY, so fall back to that name.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FLASH_PORT:-8080}:80"
    networks:
      - flash

networks:
  flash:
    driver: bridge

volumes:
  flash_models:
