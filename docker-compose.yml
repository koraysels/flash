services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      FLASH_TRACK_DEBUG: ${FLASH_TRACK_DEBUG:-0}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      FLASH_PIN: ${FLASH_PIN}
      JWT_SECRET: ${JWT_SECRET}
      # MQTT speed-event publisher (broker = flash-mqtt on the tailnet)
      MQTT_HOST: ${MQTT_HOST:-100.71.177.9}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-flash}
      MQTT_PASS: ${MQTT_PASS:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-krocky/speed}
      MQTT_SPEED_FLOOR: ${MQTT_SPEED_FLOOR:-0}
      HLS_LATENCY_S: ${HLS_LATENCY_S:-8}
      # Detection model: traffic_detector (custom, default) | yolov8s | yolov8m
      FLASH_MODEL: ${FLASH_MODEL:-traffic_detector}
      # Pi kiosk hosts (user@ip) — used for the dashboard reachability probe
      SSH_PI_01: ${SSH_PI_01:-}
      SSH_PI_02: ${SSH_PI_02:-}
      SSH_PI_03: ${SSH_PI_03:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - flash_models:/app/backend/models
      # Last-frame preview cache: one overwritten JPEG per camera, so size is
      # bounded by camera count (≈100 KB each) and never grows over time.
      - flash_snapshots:/app/backend/data/snapshots
    networks:
      - flash

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: bf2b55990918f3eb8509991fa5bb3756018a109944c2324b
      POSTGRES_DB: flash
    volumes:
      - flash_pgdata:/var/lib/postgresql/data
    ports:
      # TEMP: one-time data restore over the tailnet; removed in the cutover commit.
      - "55432:5432"
    networks:
      - flash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Vite needs the VITE_ prefix at build time; the stack .env stores it as
        # GOOGLE_MAPS_API_KEY, so fall back to that name.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FLASH_PORT:-8080}:80"
    networks:
      - flash

networks:
  flash:
    driver: bridge

volumes:
  flash_models:
  flash_snapshots:
  flash_pgdata:
